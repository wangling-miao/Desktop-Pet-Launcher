name: Release V0.2.12

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-v0.2.12-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prepare-pr:
    name: Prepare and verify V0.2.12
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v0.2.12'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply final fixes and bump version
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          VERSION = "0.2.12"
          OLD_VERSION = "0.2.11"

          gallery = Path("website/gallery/index.html")
          text = gallery.read_text(encoding="utf-8")
          note = '''            <p>
              图鉴数据来自 <code>awesome-desktop-pets</code>。投稿合并后会自动生成索引，无需手动维护页面。
            </p>
          '''
          if note in text:
              text = text.replace(note, "", 1)
          gallery.write_text(text, encoding="utf-8")

          i18n = Path("website/i18n.js")
          text = i18n.read_text(encoding="utf-8")
          translation = '''  add(
            "图鉴数据来自 awesome-desktop-pets。投稿合并后会自动生成索引，无需手动维护页面。",
            "图鉴数据来自 awesome-desktop-pets。投稿合并后会自动生成索引，无需手动维护页面。",
            "Gallery data comes from awesome-desktop-pets. Once a contribution is merged, the index is generated automatically without manual page maintenance.",
          );
          '''
          if translation in text:
              text = text.replace(translation, "", 1)
          i18n.write_text(text, encoding="utf-8")

          home = Path("website/index.html")
          text = home.read_text(encoding="utf-8")
          old_icon = '''                <span class="os-icon os-icon--windows" aria-hidden="true">
                  <i></i><i></i><i></i><i></i>
                </span>'''
          new_icon = '''                <span class="os-icon os-icon--windows" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M3 4h8v7H3V4Zm10 0h8v7h-8V4ZM3 13h8v7H3v-7Zm10 0h8v7h-8v-7Z" />
                  </svg>
                </span>'''
          if old_icon in text:
              text = text.replace(old_icon, new_icon, 1)
          elif new_icon not in text:
              raise SystemExit("Windows icon markup not found")
          home.write_text(text, encoding="utf-8")

          css = Path("website/landing-download.css")
          text = css.read_text(encoding="utf-8")
          old_css = '''.os-icon--windows {
            grid-template-columns: repeat(2, 10px);
            grid-template-rows: repeat(2, 10px);
            gap: 2px;
          }

          .os-icon--windows i {
            width: 10px;
            height: 10px;
            background: currentColor;
          }
          '''
          new_css = '''.os-icon--windows svg {
            fill: currentColor;
          }
          '''
          if old_css in text:
              text = text.replace(old_css, new_css, 1)
          elif new_css not in text:
              raise SystemExit("Windows icon CSS not found")
          css.write_text(text, encoding="utf-8")

          package = Path("package.json")
          data = json.loads(package.read_text(encoding="utf-8"))
          data["version"] = VERSION
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          package_lock = Path("package-lock.json")
          if package_lock.exists():
              data = json.loads(package_lock.read_text(encoding="utf-8"))
              data["version"] = VERSION
              if isinstance(data.get("packages"), dict) and isinstance(data["packages"].get(""), dict):
                  data["packages"][""]["version"] = VERSION
              package_lock.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          cargo = Path("src-tauri/Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          old = f'version = "{OLD_VERSION}"'
          if old in text:
              text = text.replace(old, f'version = "{VERSION}"', 1)
          elif f'version = "{VERSION}"' not in text:
              raise SystemExit("Cargo.toml version not found")
          cargo.write_text(text, encoding="utf-8")

          cargo_lock = Path("src-tauri/Cargo.lock")
          text = cargo_lock.read_text(encoding="utf-8")
          old = f'name = "desktop-pet-launcher"\nversion = "{OLD_VERSION}"'
          new = f'name = "desktop-pet-launcher"\nversion = "{VERSION}"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Cargo.lock root package version not found")
          cargo_lock.write_text(text, encoding="utf-8")

          tauri = Path("src-tauri/tauri.conf.json")
          data = json.loads(tauri.read_text(encoding="utf-8"))
          data["version"] = VERSION
          tauri.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Commit prepared release branch
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json website/index.html website/gallery/index.html website/i18n.js website/landing-download.css
            git commit -m "release: prepare V0.2.12"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend and website checks
        run: npm run check

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  quality:
    name: Release quality gate
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'release: V0.2.12')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend and website checks
        run: npm run check

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    name: Create draft release
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create V0.2.12 draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Desktop Pet Launcher V0.2.12

          ### Highlights
          - Added Chinese/English website i18n with browser-language detection and a manual language switcher.
          - Improved networking with a shared asynchronous HTTP client and reduced redundant settings writes.
          - Split Tauri capabilities by window and improved path/package handling.
          - Added permanent frontend/Rust CI and a quality gate for releases.
          - Added Apache-2.0 licensing for the source code.
          - Fixed the Windows download-card icon and cleaned up gallery copy.
          - Includes animation, click-through polling, duplicate pet ID, and maintainability improvements.

          Download the installer for your operating system from the assets below.
          EOF
          gh release create V0.2.12 \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "Desktop Pet Launcher V0.2.12" \
            --notes-file /tmp/release-notes.md \
            --draft

  build:
    name: Build ${{ matrix.label }}
    needs: release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            args: ""
            rust_targets: ""
          - label: Linux x64
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - label: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - label: macOS Intel
            platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: V0.2.12

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install macOS DMG dependencies
        if: startsWith(matrix.platform, 'macos-')
        run: brew install create-dmg || brew upgrade create-dmg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: V0.2.12
          releaseName: Desktop Pet Launcher V0.2.12
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Publish V0.2.12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit V0.2.12 --repo "${{ github.repository }}" --draft=false

  deploy-pages:
    name: Deploy website
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write release manifest
        shell: bash
        run: |
          cat > website/latest.json <<'EOF'
          {
            "version": "V0.2.12",
            "name": "Desktop Pet Launcher V0.2.12",
            "releaseUrl": "https://github.com/${{ github.repository }}/releases/tag/V0.2.12"
          }
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
