name: Maintenance Quality Upgrade

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/maintenance-quality-upgrade.yml"

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify quality upgrade
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch, test, and publish result
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          exec > >(tee quality-upgrade-action.log) 2>&1

          on_error() {
            status=$?
            set +e
            git add -A
            git commit -m "Record quality upgrade verification failure"
            git push --force origin HEAD:refs/heads/automation/quality-upgrade-v7-failure-20260810
            exit "$status"
          }
          trap on_error ERR

          python scripts/apply_quality_upgrade.py
          npm ci
          rustup component add rustfmt clippy
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          npm run check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

          trap - ERR
          rm -f quality-upgrade-action.log
          git add -A
          git commit -m "Improve reliability and engineering quality"
          git commit --allow-empty -m "Quality upgrade verification passed"
          git push --force origin HEAD:refs/heads/automation/quality-upgrade-v7-verified-20260810
