name: Maintenance Quality Upgrade

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/maintenance-quality-upgrade.yml"

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify quality upgrade
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create diagnostic branch
        run: |
          git switch -c automation/quality-upgrade-v6-20260810
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:refs/heads/automation/quality-upgrade-v6-20260810

      - name: Decode patch source
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path

          source = Path("scripts/apply_quality_upgrade.py").read_text(encoding="utf-8")
          match = re.search(r'b64decode\("([A-Za-z0-9+/=]+)"\)', source)
          if not match:
              raise SystemExit("encoded patch payload not found")
          decoded = zlib.decompress(base64.b64decode(match.group(1)))
          Path("quality-upgrade-decoded.py").write_bytes(decoded)
          PY
          git add quality-upgrade-decoded.py
          git commit -m "Expose quality upgrade patch source"
          git push origin HEAD:refs/heads/automation/quality-upgrade-v6-20260810

      - name: Apply upgrade with diagnostics
        shell: bash
        run: |
          set +e
          timeout 30s python quality-upgrade-decoded.py > quality-upgrade-run.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git add quality-upgrade-run.log
            git commit -m "Record quality upgrade patch failure"
            git push origin HEAD:refs/heads/automation/quality-upgrade-v6-20260810
            exit "$status"
          fi
          rm -f quality-upgrade-decoded.py quality-upgrade-run.log

      - name: Publish raw candidate
        run: |
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "Apply quality upgrade candidate"
          git push --force origin HEAD:refs/heads/automation/quality-upgrade-v6-20260810

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Format Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          if ! git diff --quiet; then
            git add -A
            git commit -m "Format quality upgrade"
            git push origin HEAD:refs/heads/automation/quality-upgrade-v6-20260810
          fi

      - name: Frontend checks
        run: npm run check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Mark verification passed
        run: |
          git commit --allow-empty -m "Quality upgrade verification passed"
          git push origin HEAD:refs/heads/automation/quality-upgrade-v6-20260810
