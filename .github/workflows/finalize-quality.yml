name: Finalize Quality Upgrade

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-fix:
    name: Verify and fix quality upgrade
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Apply Linux Clippy fix
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f .quality-verify-retry ]; then
            python <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "\nfn physical_from_logical(value: f64, scale_factor: f64) -> i32 {",
                  "\n#[cfg(windows)]\nfn physical_from_logical(value: f64, scale_factor: f64) -> i32 {",
              ),
              (
                  "\nfn physical_size_from_logical(value: f64, scale_factor: f64) -> i32 {",
                  "\n#[cfg(windows)]\nfn physical_size_from_logical(value: f64, scale_factor: f64) -> i32 {",
              ),
              (
                  "\nfn round_to_i32(value: f64) -> i32 {",
                  "\n#[cfg(windows)]\nfn round_to_i32(value: f64) -> i32 {",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected snippet not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
            cargo fmt --manifest-path src-tauri/Cargo.toml --all
            rm .quality-verify-retry
          fi

      - name: Frontend checks
        run: npm run check

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Commit verified fix
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/src/lib.rs .quality-verify-retry
            git commit -m "Fix platform-specific Rust lint"
            git push origin HEAD:main
          fi
