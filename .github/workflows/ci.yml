name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-prep:
    name: Prepare V0.2.12 release branch
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'release/v0.2.12' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prepare release source
        run: |
          python scripts/prepare-v0.2.12.py
          git diff --check

      - name: Commit prepared release branch
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "release: prepare V0.2.12"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend and website checks
        run: npm run check

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, version check, and build
        run: npm run check

  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Prepare Tauri frontendDist
        run: |
          mkdir -p dist
          printf '<!doctype html><html><body></body></html>\n' > dist/index.html

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  create-release:
    name: Create V0.2.12 draft release
    if: >-
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, 'release: V0.2.12')) ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'release/publish-v0.2.12' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - frontend
      - rust
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Desktop Pet Launcher V0.2.12

          ### Highlights
          - Added Chinese/English website i18n with browser-language detection and a manual language switcher.
          - Improved networking with a shared asynchronous HTTP client and reduced redundant settings writes.
          - Split Tauri capabilities by window and improved path/package handling.
          - Added permanent frontend/Rust CI and release quality checks.
          - Added Apache-2.0 licensing for the source code.
          - Fixed the Windows download-card icon and removed the gallery index-maintenance note.
          - Includes animation, click-through polling, duplicate pet ID, and maintainability improvements.

          Download the installer for your operating system from the assets below.
          EOF
          gh release create V0.2.12 \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "Desktop Pet Launcher V0.2.12" \
            --notes-file /tmp/release-notes.md \
            --draft

  build-release:
    name: Build ${{ matrix.label }}
    needs: create-release
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            args: ""
            rust_targets: ""
          - label: Linux x64
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - label: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - label: macOS Intel
            platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: V0.2.12

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install macOS DMG dependencies
        if: startsWith(matrix.platform, 'macos-')
        run: brew install create-dmg || brew upgrade create-dmg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: V0.2.12
          releaseName: Desktop Pet Launcher V0.2.12
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    name: Publish V0.2.12
    needs: build-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit V0.2.12 --repo "${{ github.repository }}" --draft=false

  deploy-release-pages:
    name: Deploy V0.2.12 website
    needs: publish-release
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write release manifest
        shell: bash
        run: |
          cat > website/latest.json <<'EOF'
          {
            "version": "V0.2.12",
            "name": "Desktop Pet Launcher V0.2.12",
            "releaseUrl": "https://github.com/${{ github.repository }}/releases/tag/V0.2.12"
          }
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
