name: Quality Upgrade PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    if: github.head_ref == 'automation/quality-upgrade-pr-20260810'
    name: Apply and verify quality upgrade
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Apply quality upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f .quality-upgrade-request ]; then
            mkdir -p scripts
            git fetch origin automation/quality-upgrade-v6-20260810
            git show FETCH_HEAD:quality-upgrade-decoded.py > scripts/quality_upgrade_plain.py
            python scripts/quality_upgrade_plain.py
            rm -f scripts/quality_upgrade_plain.py .quality-upgrade-request
            cargo fmt --manifest-path src-tauri/Cargo.toml --all

            # GitHub Actions' token cannot create/update workflow files. Keep the
            # generated application changes, but leave workflow files for the
            # authenticated GitHub connector to apply after code verification.
            git checkout HEAD -- .github/workflows/release.yml .github/workflows/upgrade-pr.yml
            rm -f .github/workflows/ci.yml

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Improve reliability and engineering quality"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Frontend checks
        run: npm run check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
